name: iPhone native startup

# Manual diagnostic: compile the TEST voice binary and launch it in a simulator.
# No provider credentials, calls, APNs delivery or store submission are involved.
jobs:
  build_ios_simulator:
    type: build
    params:
      platform: ios
      profile: voice-proof-simulator
  boot_ios:
    needs: [build_ios_simulator]
    type: maestro
    environment: preview
    params:
      build_id: ${{ needs.build_ios_simulator.outputs.build_id }}
      flow_path: ./maestro/iphone-startup.yaml
      retries: 0
