name: Full CI (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install host test tools
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        # NODE_ENV=test drží guardy MIMO 6 dev-bypassov (api-auth.ts) → load-bearing 0.2 enum test reálne meria auth.
        env:
          NODE_ENV: test
        run: pnpm test

      - name: Build
        run: pnpm run build
