packages:
  - .
  - apps/*

# Keep vulnerable transitive resolutions on patched releases within their majors.
overrides:
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'browserslist@<4.28.7': 4.28.7

allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
