packages:
  - .
  - apps/*

# Keep vulnerable transitive resolutions on patched releases within their majors.
overrides:
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'browserslist@>=4.0.0 <4.28.7': 4.28.7
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'undici@>=6.0.0 <6.29.1': 6.29.1
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'zod@>=4.0.0 <4.6.6': 4.6.6
  'vite@>=8.0.0 <8.1.6': 8.1.6

allowBuilds:
  '@sentry/cli': true
  esbuild: true
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
