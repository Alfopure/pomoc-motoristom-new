#cloud-config
timezone: UTC
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - docker.io
  - docker-compose-v2
  - dnsutils
  - unattended-upgrades
  - vnstat

users:
  - default
  - name: deploy
    groups: [adm, docker, sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - __DEPLOY_SSH_PUBLIC_KEY__

ssh_pwauth: false
disable_root: true

write_files:
  - path: /etc/ssh/sshd_config.d/99-motorist-hardening.conf
    owner: root:root
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
      X11Forwarding no
      AllowUsers deploy
  - path: /etc/apt/apt.conf.d/52motorist-unattended-upgrades
    owner: root:root
    permissions: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
  - path: /etc/docker/daemon.json
    owner: root:root
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "5"
        }
      }
  - path: /etc/sysctl.d/99-motorist.conf
    owner: root:root
    permissions: "0644"
    content: |
      vm.swappiness=10

runcmd:
  - [bash, -lc, "install -d -o deploy -g deploy -m 0750 /opt/motorist /opt/motorist/releases"]
  - [bash, -lc, "if [ ! -f /swapfile ]; then fallocate -l 2G /swapfile; chmod 600 /swapfile; mkswap /swapfile; swapon /swapfile; echo '/swapfile none swap sw 0 0' >> /etc/fstab; fi"]
  - [bash, -lc, "sysctl --system"]
  - [bash, -lc, "systemctl enable --now docker vnstat unattended-upgrades"]
  - [bash, -lc, "systemctl restart ssh docker"]
  - [bash, -lc, "touch /var/lib/motorist-cloud-init-complete"]

final_message: "motorist production host ready"
