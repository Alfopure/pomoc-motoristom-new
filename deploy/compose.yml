name: motorist-dispatch

x-web-common: &web-common
  platform: linux/amd64
  restart: unless-stopped
  secrets:
    - source: web_runtime
      target: runtime_env
  expose:
    - "3000"
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  cap_add:
    - DAC_OVERRIDE
    - SETGID
    - SETUID
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  mem_limit: 1g
  cpus: 1.25
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - process.setgroups([]);process.setgid(1001);process.setuid(1001);fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
    interval: 15s
    timeout: 5s
    retries: 4
    start_period: 30s

services:
  caddy:
    image: caddy:2.10-alpine@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - ./env/caddy.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./upstream.caddy:/etc/caddy/upstream.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      web_blue:
        condition: service_healthy

  web_blue:
    <<: *web-common
    image: ${WEB_BLUE_IMAGE:?WEB_BLUE_IMAGE is required}
    volumes:
      - next_cache_blue:/app/.next/cache

  web_green:
    <<: *web-common
    image: ${WEB_GREEN_IMAGE:?WEB_GREEN_IMAGE is required}
    volumes:
      - next_cache_green:/app/.next/cache

  worker:
    image: ${WORKER_IMAGE:?WORKER_IMAGE is required}
    platform: linux/amd64
    command: ["node", "runtime-entrypoint.mjs", "worker"]
    restart: unless-stopped
    secrets:
      - source: worker_runtime
        target: runtime_env
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.25
    stop_grace_period: 8m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      web_blue:
        condition: service_healthy

  viptel_listener:
    image: ${VIPTEL_LISTENER_IMAGE:?VIPTEL_LISTENER_IMAGE is required}
    platform: linux/amd64
    command: ["node", "runtime-entrypoint.mjs", "viptel-listener"]
    restart: unless-stopped
    secrets:
      - source: viptel_listener_runtime
        target: runtime_env
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.75
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      web_blue:
        condition: service_healthy

secrets:
  web_runtime:
    file: ./env/web.env
  worker_runtime:
    file: ./env/worker.env
  viptel_listener_runtime:
    file: ./env/viptel-listener.env

volumes:
  caddy_data:
  caddy_config:
  next_cache_blue:
  next_cache_green:
